# Local infrastructure for the production-faithful stack: Postgres (tenancy +
# content + commit journal, schema owned by Alembic), a GCS-protocol blob
# store (fake-gcs-server) for model snapshots, and Redis as the optional
# lease-mirror coordination plane. The backend and frontend run via pixi
# (`pixi run backend-start` / `frontend-start`) against these services.
#
#   pixi run services-start      # start + wait for healthy
#   pixi run services-stop    # stop (keeps data volumes)
#   pixi run services-reset   # stop + wipe data volumes
#
# Postgres and fake-gcs match the app defaults (DATA_ROVER_DATABASE_URL,
# fake-gcs reachable at http://localhost:4443); redis does NOT — the app's
# redis_url default is empty (mirroring off) until DATA_ROVER_REDIS_URL is
# set, so this service starts either way but sits unused by default. Data
# persists in named volumes across restarts (redis is deliberately
# volume-less; see its service comment below).
#
# This file owns CONTAINERS ONLY. Their contents belong to the app: Alembic
# owns the Postgres schema, and the backend creates the snapshot bucket at boot
# (`build_store_from_settings` passes create_bucket= when pointed at an
# emulator).
name: data-rover

services:
  postgres:
    image: postgres:16
    container_name: data-rover-pg
    environment:
      POSTGRES_USER: data_rover
      POSTGRES_PASSWORD: data_rover
      POSTGRES_DB: data_rover
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U data_rover -d data_rover"]
      interval: 3s
      timeout: 3s
      retries: 30

  # fake-gcs-server with the filesystem backend so snapshot blobs survive a
  # container restart (mirrors real GCS durability). Buckets/objects live in the
  # gcsdata volume under /storage.
  fake-gcs:
    image: fsouza/fake-gcs-server
    container_name: data-rover-fakegcs
    command:
      - "-scheme"
      - "http"
      - "-port"
      - "4443"
      - "-public-host"
      - "localhost:4443"
      - "-backend"
      - "filesystem"
      - "-data"
      - "/storage"
    ports:
      - "4443:4443"
    volumes:
      - gcsdata:/storage

  # Coordination plane (Phase 7, scoped): the backend mirrors resource leases
  # here (DATA_ROVER_REDIS_URL=redis://localhost:6379/0) so they survive a
  # backend restart. Deliberately volume-less: every lease is TTL-bounded
  # (<= lock_ttl_seconds), so a Redis restart is indistinguishable from
  # ordinary lease expiry and persistence would buy nothing.
  redis:
    image: redis:7
    container_name: data-rover-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 30

volumes:
  pgdata:
  gcsdata:
